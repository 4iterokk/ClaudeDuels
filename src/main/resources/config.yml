# GrandDuels configuration

# Language of messages and menus: en, ru, or the name of a folder you created in plugins/GrandDuels/lang/
# (copy lang/en to lang/<name>, translate the files, set the name here, then /duels reload).
language: en

storage:
  # YAML or SQLITE (changing this requires a restart)
  type: YAML

duel:
  request-expire-seconds: 30
  # true: /duel <player> opens the kit selector. false: the default kit is used immediately.
  use-kit-selector: true
  default-kit: nodebuff
  countdown-seconds: 5
  celebration-seconds: 5
  # 0 disables the time limit (a timeout ends the duel as a draw)
  max-duration-seconds: 600
  # PREVIOUS_LOCATION or LOBBY (set the lobby with /duels setlobby)
  return-mode: PREVIOUS_LOCATION
  # Arena boundary = cuboid spanned by the two arena points, expanded by this many blocks
  boundary-padding: 40.0
  # false: blocks cannot be changed inside arenas. true: changes are allowed and rolled back after the duel.
  building-enabled: false
  # Blocks restored per tick during arena rollback
  rollback-batch-size: 500
  # Commands allowed during a duel (without the leading slash)
  command-whitelist:
    - "duel cancel"

matchmaking:
  # ELO change per ranked duel (higher = faster rating swings)
  k-factor: 32
  # GLOBAL: every ranked duel moves one ELO per player (stats.yml / stats.db).
  # KIT:    every standard kit has its own ELO per player (kit-ratings.yml / kit-ratings.db) and the queue of a kit
  #         matches players by their rating in that kit. The global ELO stays as it is while this mode is active.
  # %grandduels_elo%, %grandduels_elo_<player>% and %grandduels_elo_top_<pos>_*% follow this setting (in KIT mode they
  # show the average over the kits a player is rated in); %grandduels_kit_elo_<kit>% and
  # %grandduels_kit_elo_top_<kit>_<pos>_name|count% work in KIT mode only.
  rating-mode: GLOBAL
  ranked:
    # allowed ELO difference when a player joins the queue
    initial-elo-range: 100
    # how much the allowed difference grows per second of waiting
    elo-range-per-second: 5.0
    # upper limit of the allowed difference (0 = unlimited)
    max-elo-range: 800

# Per-item consumption / usage cooldowns in seconds (0 disables)
cooldowns:
  golden-apple: 30
  enchanted-golden-apple: 30
  trident: 5
  wind-charge: 3
  ender-pearl: 15
  chorus-fruit: 10

rules:
  elytra-disabled: true
  # false: right-clicking a Riptide trident is blocked
  riptide-enabled: false
  block-item-drop: true
  block-item-pickup: true
  # Heavy attacks only: mace smash (fall distance > 1.5) and spear charge (sprinting).
  # max-damage: 0 = vanilla. knockback-multiplier: 1.0 = vanilla.
  mace:
    max-damage: 0
    knockback-multiplier: 1.0
  spear:
    max-damage: 0
    knockback-multiplier: 1.0

# Spectating running duels (/spec opens a menu of all duels, /spec <player> jumps to that player's duel).
# Spectators use spectator mode. Their inventory, gamemode and location are saved and restored when they leave,
# when the duel ends, when they quit, and after a server crash.
spectate:
  enabled: true
  # How many blocks outside the duel's arena boundary (duel.boundary-padding) spectators may fly (0 = only inside it)
  padding: 20.0
  # Maximum spectators per duel (0 = unlimited)
  max-per-match: 0
  # true: spectators can only use /spec and the commands from duel.command-whitelist (other commands could change
  # their inventory or teleport them away)
  block-commands: true

# Player-made kits (/duel kit ...)
player-kits:
  # How many kits a player may own (permission grandduels.kits.unlimited removes the limit, 0 disables player kits)
  max-per-player: 5
  # Items that can never be saved into a player kit (in addition to a built-in list of dangerous items such as
  # command blocks, spawners, barriers, written books and spawn eggs)
  banned-materials: []
  # /duel kit create|edit opens a RESTRICTED creative mode: the player cannot build, break, drop, hit, run commands
  # or leave the area, and every item is validated when the kit is saved. Their real inventory comes back afterwards.
  editor:
    # false: /duel kit create <name> just copies the inventory the player carries
    enabled: true
    # The session is cancelled after this many seconds (0 = never)
    timeout-seconds: 600
    # Editors cannot move farther than this many blocks from where they started, or from the zone below (0 = unlimited)
    radius: 10.0
    # Optional: teleport players who edit kits here (they are returned to where they were when the session ends).
    # Without it (or when the world is not loaded) they edit where they stand.
    # zone:
    #   world: world
    #   x: 0.5
    #   y: 64.0
    #   z: 0.5
    #   yaw: 0.0
    #   pitch: 0.0
    # An item whose serialized form is larger than this is rejected (0 = unlimited)
    max-item-bytes: 4096
    # Crafting stations editors may use (to combine and enchant items). Everything else stays blocked.
    # Available: WORKBENCH (crafting table), ANVIL, ENCHANTING, GRINDSTONE, SMITHING, STONECUTTER, LOOM, CARTOGRAPHY
    allowed-inventories:
      - WORKBENCH
      - ANVIL
      - ENCHANTING
      - GRINDSTONE
      - SMITHING

# Arena mode (/arena): pick a kit, fight in a free-for-all, return to the lobby when you die.
arena-mode:
  enabled: true
  # Set with /duels setarenaspawn. Players are teleported here; without it /arena is unavailable.
  # spawn:
  #   world: world
  #   x: 0.5
  #   y: 64.0
  #   z: 0.5
  #   yaw: 0.0
  #   pitch: 0.0
  # Players cannot move farther than this from the spawn (0 = unlimited)
  radius: 60.0
  # /arena leave is refused this many seconds after fighting another player
  combat-tag-seconds: 10
  # Combat rules of arena mode. By default arena mode uses the server defaults of lang/<language>/menu/player/cooldowns.yml
  # (the same as duels). Set enabled: true to give arena mode its own rules, applied when a player joins the arena.
  combat:
    # true: the cooldowns / bans below apply (without it the server defaults of the cooldowns menu file apply, which
    # have no cooldowns). NOTE: the old top-level "cooldowns:" section is not used by the plugin.
    enabled: true
    # false: no custom cooldowns at all (vanilla cooldowns only)
    custom-cooldowns: true
    # Seconds per item (0 = no cooldown); items you leave out keep their server default.
    # Keys: golden-apple, enchanted-golden-apple, trident, wind-charge, ender-pearl, chorus-fruit, firework-rocket
    cooldowns:
      golden-apple: 30
      enchanted-golden-apple: 30
      trident: 5
      wind-charge: 3
      ender-pearl: 15
      chorus-fruit: 10
      firework-rocket: 0
    # Banned items/abilities: golden-apple, enchanted-golden-apple, trident, wind-charge, ender-pearl, chorus-fruit,
    # firework-rocket, elytra, riptide. Banned items are removed from the kit.
    # Leave the list out to keep the server defaults; an empty list [] bans nothing.
    banned:
      - elytra
      - riptide
    # Boss bar shown to arena players while they are combat tagged (texts: arenamode.bossbar-* in messages.yml)
    bossbar:
      enabled: true
      # BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
      color: RED
      # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
      style: PROGRESS
      # true: the bar stays visible (full, with the "safe" text) when the combat tag has expired
      show-when-safe: false
