  editor-blocked: "&cYou cannot do that while editing a kit."
  editor-item-rejected: "&cThat item is not allowed in kits."
  editor-out-of-area: "&cYou cannot leave the kit editing area."
  editor-command-blocked: "&cYou can only use &f/duel kit save &cor &f/duel kit cancel &cwhile editing a kit."
  exists: "&cYou already have a kit named &f{kit}&c. Use &f/duel kit edit {kit} &cto change it."
  limit: "&cYou reached your kit limit (&f{limit}&c). Delete a kit first."
  empty: "&cYou have nothing to save. Put items in your inventory first."
  disabled: "&cPlayer kits are disabled."
  skipped: "&e{count} item(s) that are not allowed in kits were not saved."
  deleted: "&7Kit &f{kit} &7deleted."
  not-found: "&cYou have no kit named &f{kit}&c."
  list: "&7Your kits (&f{count}&7/&f{limit}&7): &f{kits}"
  list-empty: "&7You have no kits yet. Create one with &f/duel kit create <name>&7."

