# Меню выбора набора (/duel <игрок>). Всё здесь можно настраивать.
#
# Ключи предметов: slot (число или диапазон "0-8") | slots, material, amount, name, lore (список или строка), enchanted, action, condition
# Действия:   PREVIOUS_PAGE, NEXT_PAGE, OPEN_COOLDOWNS, CLOSE
# Условия:    has-previous, has-next, no-kits  ("!флаг" - отрицание)
# Плейсхолдеры: {page} {pages} {target}

menu_title: "&8Выберите набор"
size: 54   # размер меню в слотах (кратно 9, максимум 54)

filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

# Слоты, в которых показываются наборы (числа и диапазоны "от-до"). Наборов на странице = число слотов.
kit-slots: ["0-44"]

# Шаблон каждого набора. Материал иконки берётся из kits.yml.
# Плейсхолдеры: {kit_name}. Особые строки lore: {kit_description} (описание набора) и {kit_features} (теги ниже)
kit-item:
  name: "{kit_name}"
  enchanted: false
  lore:
    - "{kit_description}"
    - ""
    - "{kit_features}"
    - ""
    - "&eНажмите, чтобы выбрать"
    - "&eПКМ — предпросмотр набора"

# Показываются в {kit_features}, если в наборе есть предмет. {components} = изменённые компоненты данных.
tags:
  mace: "&8• &7Булава"
  wind-charge: "&8• &7Заряды ветра"
  trident: "&8• &7Трезубец"
  spear: "&8• &7Копьё"
  wolf-armor: "&8• &7Броня для волка"
  components: "&8• &7Компоненты данных: &f{components}"

items:
  previous:
    slot: 45
    material: ARROW
    name: "&7« Предыдущая страница"
    action: PREVIOUS_PAGE
    condition: has-previous
  next:
    slot: 53
    material: ARROW
    name: "&7Следующая страница »"
    action: NEXT_PAGE
    condition: has-next
  page:
    slot: 49
    material: PAPER
    name: "&7Страница &f{page}&7/&f{pages}"
  my-cooldowns:
    slot: 50
    material: CLOCK
    name: "&6Мои кулдауны и ограничения"
    lore:
      - "&7Применяются автоматически к каждому"
      - "&7отправляемому вами вызову."
      - ""
      - "&eНажмите, чтобы изменить"
    action: OPEN_COOLDOWNS
  close:
    slot: 48
    material: BARRIER
    name: "&cЗакрыть"
    action: CLOSE
  no-kits:
    slot: 22
    material: BARRIER
    name: "&cНет доступных наборов"
    condition: no-kits
